<template>
    <lightning-card title="My Support Cases" icon-name="standard:case">
        <div class="slds-p-horizontal_medium">
            <template lwc:if={error}>
                <p class="slds-text-color_error">{error}</p>
            </template>
            <template lwc:if={hasCases}>
                <lightning-datatable
                    key-field="Id"
                    data={cases}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>
            </template>
            <template lwc:else>
                <p class="slds-text-color_weak">No cases yet.</p>
            </template>
        </div>
    </lightning-card>
</template>
